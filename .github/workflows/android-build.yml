name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      name: Android CI

      on:
        push:
          paths:
            - 'android/**'
            - '.github/workflows/android-build.yml'

      jobs:
        build:
          runs-on: ubuntu-latest
          env:
            ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                path: |
                  ~/.gradle/caches
                  ~/.gradle/wrapper
                key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
                restore-keys: |
                  ${{ runner.os }}-gradle-

            - name: Install Android SDK commandline tools
              run: |
                sudo apt-get update
                sudo apt-get install -y unzip wget
                mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
                wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
                unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
                rm cmdline-tools.zip
                if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
                  mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
                fi
                export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
                yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
                yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

            - name: Use Gradle action to build release
              uses: gradle/gradle-build-action@v2
              with:
                gradle-version: '8.1.1'
                arguments: '-p android :app:assembleRelease --no-daemon'
              env:
                ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
                ANDROID_HOME: ${{ runner.temp }}/android-sdk

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                name: app-release-apk
                path: android/app/build/outputs/apk/release/*.apk
