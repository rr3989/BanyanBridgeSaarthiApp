name: Android CI smoke

on:
  push:
    branches:
      - android-skeleton
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm runner works
        run: |
          echo "GitHub Actions is running successfully."
          pwd
          ls -la
          echo "Workflow is valid and ready for Android build steps."
